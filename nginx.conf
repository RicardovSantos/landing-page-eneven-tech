# Configuração servida pelo container (substitui a default.conf do nginx:alpine,
# que vem com gzip desligado e sem cache de estáticos).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Compressão -----------------------------------------------------------
  # HTML/CSS/JS saíam sem compressão (~104 KB); com gzip caem para ~26 KB.
  # WebP/JPEG/PNG já são comprimidos: gzip neles só gastaria CPU.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # --- Cache ----------------------------------------------------------------
  # Um único Cache-Control por resposta: "expires" já escreve o header, então
  # aqui ele fica de fora e o valor completo vai num add_header só.

  # Imagens e fontes: o nome do arquivo muda quando a arte muda, então 1 ano.
  location ~* \.(webp|jpe?g|png|gif|ico|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # CSS/JS: 7 dias com revalidação — não têm hash no nome do arquivo.
  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=604800, must-revalidate";
  }

  # HTML e o resto: sempre revalidado. A landing muda com frequência e o
  # Google Ads precisa avaliar a versão atual da página de destino.
  # As regex acima têm prioridade sobre este prefixo, então só sobra o HTML.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
