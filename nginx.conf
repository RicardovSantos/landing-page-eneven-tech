# Configuração servida pelo container (substitui a default.conf do nginx:alpine,
# que vem com gzip desligado e sem cache de estáticos).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Compressão -----------------------------------------------------------
  # HTML/CSS/JS saíam sem compressão (~104 KB); com gzip caem para ~26 KB.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;
  # WebP/JPEG/PNG já são comprimidos: gzip neles só gasta CPU.

  # --- Cache ----------------------------------------------------------------
  # Imagens e fontes: imutáveis por 1 ano (o nome do arquivo muda quando a arte muda).
  location ~* \.(webp|jpe?g|png|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # CSS/JS: 7 dias, com revalidação — não têm hash no nome.
  location ~* \.(css|js)$ {
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
  }

  # HTML sempre revalidado: a landing muda com frequência e o Google Ads
  # precisa ver a versão atual da página de destino.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
